<main class="auth-page">
  <section class="auth-shell">
    <div class="auth-visual">
      <img class="auth-visual-background" src="assets/site/atlasmap.png" alt="" />
      <div class="auth-visual-copy">
        <strong>AtlasMap</strong>
        <p>Entre para acompanhar squads e projetos de energia e sustentabilidade.</p>
      </div>
    </div>
    <div class="auth-content">
      <a class="back-link" routerLink="/">← Voltar</a>
      <p class="eyebrow">Bem-vindo de volta</p>
      <h1>Entrar</h1>
      <form (ngSubmit)="submit()">
        <label for="login-email">E-mail</label>
        <input
          id="login-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="exemplo@atlasmap.com"
          autocomplete="email"
          required
        />
        <label for="login-password">Senha</label>
        <input
          id="login-password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        />
        <button class="primary-button full-button" type="submit">Entrar</button>
      </form>
      <div class="social-buttons">
        <button type="button" (click)="social('Google')"><span>G</span> Entrar com o Google</button>
        <button type="button" (click)="social('GitHub')">
          <span>GH</span> Entrar com o GitHub
        </button>
      </div>
      <p class="auth-switch">Não tem uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
    </div>
  </section>
</main>
